<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МТС · 33 удовольствия — прототип и ТЗ</title>
<!--
  Кликабельный прототип + ТЗ в одном файле. Версия 0.2 от 01.10.2026.
  Как вносить правки: данные (блоки, активности, механики, экраны, вопросы) — в объектах
  PROJECT / BLOCKS / ACTS / MECH / SCREENS / QUESTIONS; обе вкладки строятся из них.
  Любая правка прототипа = правка данных/текста ТЗ + запись в CHANGELOG.
-->
<style>
:root{
  --ink:#1b1b1f; --ink2:#3a3a42; --muted:#6b6b76; --line:#d6d6dd; --line2:#e7e7ec;
  --bg:#e9ebef; --paper:#fff; --ph:#f2f3f5; --ph2:#e6e7eb;
  --red:#ff0032; --red-ink:#d4002a; --red-soft:#ffe9ee;
  --ok:#15803d; --ok-soft:#e6f5eb; --warn:#b45309; --warn-soft:#fdf0df; --draft:#6d28d9; --draft-soft:#f0eafc;
  --chrome:#141419; --r:12px;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 var(--font);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}

/* ---------- Tool chrome ---------- */
.chrome{flex:none;display:flex;align-items:center;gap:16px;height:52px;padding:0 16px;background:var(--chrome);color:#fff}
.chrome .brand{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap;min-width:0}
.chrome .brand .ver{font-weight:400;color:#a3a3ad;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.mtsbox{display:inline-grid;place-items:center;width:28px;height:28px;background:var(--red);color:#fff;font-size:9px;font-weight:800;letter-spacing:.02em;border-radius:3px;flex:none}
.tabs{margin-left:auto;display:flex;gap:4px;background:#26262e;padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;color:#c9c9d1;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--chrome)}
@media (max-width:720px){.chrome .brand .ver{display:none}.tabs button{padding:6px 10px}}
@media (max-width:520px){.chrome .brand span:not(.mtsbox){display:none}.chrome{gap:8px;padding:0 10px}}

/* ---------- Prototype tab ---------- */
#tab-proto{flex:1;min-height:0;display:flex;flex-direction:column}
.demo{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 14px;background:#f7f7f9;border-bottom:1px solid var(--line);font-size:13px}
.demo .lbl{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.demo .grp{display:flex;align-items:center;gap:6px}
.demo select{padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:175px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg2 button{border:0;background:transparent;padding:4px 9px;cursor:pointer}
.seg2 button.on{background:var(--ink);color:#fff}
.dbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;cursor:pointer}
.dbtn:hover{border-color:var(--ink2)}
.dbtn.on{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:14px 16px 16px}
.frame{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;width:100%;max-width:1280px;height:100%;box-shadow:0 10px 30px rgba(20,20,30,.08)}
.frame.mobile{width:390px;max-width:390px;height:min(100%,844px);border:10px solid #202027;border-radius:36px}
.urlbar{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;background:#f4f4f6;border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted)}
.urlbar .dots{display:flex;gap:5px}.urlbar .dots i{width:9px;height:9px;border-radius:50%;background:#d4d4da;display:block}
.urlbar .url{flex:1;min-width:0;background:#fff;border:1px solid var(--line2);border-radius:6px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame.mobile .urlbar .dots{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
#overlay{position:absolute;inset:0;z-index:40;display:none;background:rgba(20,20,26,.45);align-items:center;justify-content:center;padding:16px}
#overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.modal h3{margin:8px 0 6px;font-size:20px}
.modal p{margin:0 0 14px;color:var(--ink2)}
#toasts{position:absolute;left:0;right:0;bottom:14px;z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease-out;max-width:90%}
.toast b{color:#ffb3c2}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.tzbtn{position:absolute;right:14px;bottom:14px;z-index:30;border:1px dashed #9b9ba6;background:rgba(255,255,255,.95);color:var(--ink2);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}
.tzbtn:hover{border-style:solid;border-color:var(--ink)}
.frame.mobile .tzbtn{bottom:10px;right:10px}

/* ---------- Site (inside frame) ---------- */
.site{container-type:inline-size;min-height:100%;display:flex;flex-direction:column;position:relative;background:#fff}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 28px}
.sh{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line2)}
.sh .wrap{display:flex;align-items:center;gap:22px;height:60px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;white-space:nowrap}
.logo .mtsbox{width:34px;height:34px;font-size:10px}
.nav{display:flex;gap:18px;font-size:14px}
.nav a{text-decoration:none;color:var(--ink2);cursor:pointer;padding:4px 0;border-bottom:2px solid transparent}
.nav a.on{color:var(--ink);border-bottom-color:var(--red)}
.sh .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:13px;cursor:pointer;white-space:nowrap}
.pchip .ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--red) var(--p,0%), var(--ph2) 0)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ph2);display:grid;place-items:center;font-size:12px;font-weight:700;cursor:pointer;flex:none}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:38px;height:34px;cursor:pointer}
.mmenu{display:none}
.main{flex:1}
.sf{margin-top:48px;border-top:1px solid var(--line2);background:#fafafb;font-size:13px;color:var(--muted)}
.sf .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;padding-top:18px;padding-bottom:60px}
.sf a{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:#fff;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-ink)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--red-ink);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3{line-height:1.15;margin:0}
.pg-h{padding-top:26px;padding-bottom:6px}
.pg-h h1{font-size:30px;margin:6px 0 6px}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs a{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}
.sec{margin-top:28px}
.sec>h2{font-size:21px;margin-bottom:12px}

/* placeholders */
.ph{background:var(--ph) repeating-linear-gradient(45deg,transparent 0 10px,rgba(0,0,0,.035) 10px 20px);border:1px dashed #c9c9d1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8c8c97;font-size:12px;text-align:center;padding:6px}
.ph.round{border-radius:50%}
.lines i{display:block;height:9px;border-radius:5px;background:var(--ph2);margin:7px 0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;background:#fff}
.chip.pl{border-color:#f3b3c1;background:var(--red-soft);color:var(--red-ink)}
.chip.st-open{border-color:var(--ink);font-weight:600}
.chip.st-open::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
.chip.st-partial{border-color:var(--red);color:var(--red-ink)}
.chip.st-done{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.st-soon,.chip.st-closed,.chip.st-ended{color:var(--muted);background:var(--ph)}
.chip.st-locked{color:var(--muted);border-style:dashed}
.chip.st-pending{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.chip.hh{background:#fff4c2;border-color:#e3c24a;color:#7a5a00;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sbadge{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;vertical-align:middle;white-space:nowrap}
.sbadge.ok{background:var(--ok-soft);color:var(--ok)}
.sbadge.client{background:var(--warn-soft);color:var(--warn)}
.sbadge.draft{background:var(--draft-soft);color:var(--draft)}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center;padding-top:30px;padding-bottom:10px}
.kicker{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero h1{font-size:44px;letter-spacing:-.01em;margin:10px 0 12px}
.hero p{color:var(--ink2);margin:0 0 18px;max-width:520px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.cake{width:100%;max-width:440px;display:block;margin:0 auto}
.cake .seg path{fill:#f6f6f8;stroke:#c7c7cf;stroke-width:1.5;cursor:pointer;transition:fill .15s}
.cake .seg:hover path{fill:#fff0f3}
.cake .dot{fill:#fff;stroke:#b9b9c3;stroke-width:1.5;pointer-events:none}
.cake .dot.on{fill:var(--red);stroke:var(--red)}
.cake text{pointer-events:none;font-family:var(--font)}
.cake .segl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.cake .segn{font-size:11.5px;fill:var(--muted)}
.cake .core{fill:#fff;stroke:#c7c7cf;stroke-width:1.5}
.cake .core33{font-size:30px;font-weight:800;fill:var(--red)}
.pcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:520px;margin-top:6px}
.pcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pcard .num{font-size:28px;font-weight:800}
.bar{height:8px;background:var(--ph2);border-radius:5px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--red);border-radius:5px}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.phase{display:flex;gap:10px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:#fff}
.phase .pn{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.phase .pt{font-weight:700}.phase .pd{font-size:12px;color:var(--muted)}.phase .px{font-size:12.5px;color:var(--muted);margin-top:4px}
.phase.on{border-color:var(--red);background:var(--red-soft)}.phase.on .pn{background:var(--red);border-color:var(--red);color:#fff}
.phase.past .pn{background:var(--ink);border-color:var(--ink);color:#fff}
.btiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.btile{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.btile:hover{border-color:var(--ink2)}.btile.extra{border-style:dashed}
.btile .t{font-weight:700;font-size:14px}.btile .s{font-size:12px;color:var(--muted)}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rtable tr.grp td{font-weight:700;background:var(--ph);font-size:13px}
.cake.prep .seg path{stroke-dasharray:6 4}
.cake .ckc{fill:#fff;stroke:#b9b9c3;stroke-width:1.2}
.cake .ckf{fill:var(--red)}
.common-strip{display:flex;align-items:center;gap:12px;justify-content:space-between;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-top:12px;cursor:pointer}
.common-strip:hover{border-color:var(--ink2)}

/* banners */
.banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;margin-top:14px;flex-wrap:wrap}
.banner.hh{background:#fff4c2;border:1px solid #e9cd62}
.banner.live{background:var(--red-soft);border:1px solid #f6b1c0}
.banner.info{background:var(--ph);border:1px solid var(--line2)}
.banner .grow{flex:1;min-width:180px}
.banner .cd{font-variant-numeric:tabular-nums;font-weight:700}

/* activity cards */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.acard{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;background:#fff;transition:border-color .15s}
.acard:hover{border-color:var(--ink2)}
.acard .top{display:flex;gap:12px}
.acard .ico{width:52px;height:52px;flex:none;font-size:10px}
.acard .t{font-weight:700;line-height:1.25}
.acard .s{font-size:12px;color:var(--muted);margin-top:2px}
.acard .d{font-size:13px;color:var(--ink2)}
.acard .bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}
.acard.dim{opacity:.72}
.acard.secret{border-style:dashed}
.alist{display:flex;flex-direction:column;gap:10px}
.arow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.arow:hover{border-color:var(--ink2)}
.arow .ico{width:44px;height:44px;flex:none;font-size:10px}
.arow .grow{flex:1;min-width:0}
.arow .t{font-weight:700}
.arow .d{font-size:13px;color:var(--ink2)}
.arow .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.arow .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* activity page */
.apage{max-width:860px}
.apage .chips{margin:10px 0 4px}
.panel{border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.panel.center{text-align:center;padding:30px 18px}
.panel h3{font-size:18px;margin-bottom:8px}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-top:18px}
.tabs2 button{border:0;background:transparent;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink2);font-weight:600}
.tabs2 button.on{color:var(--ink);border-bottom-color:var(--red)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.field textarea{min-height:96px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--red-ink)}
.field.bad input,.field.bad select{border-color:var(--red)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:8px}
.check input{margin-top:3px}
.drop{height:140px;cursor:pointer}
.drop.ok{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.demoact{display:inline-flex;align-items:center;gap:6px;border:1px dashed #a78bfa;color:var(--draft);background:var(--draft-soft);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.note{font-size:12px;color:var(--draft);background:var(--draft-soft);border-radius:8px;padding:6px 10px;margin-top:10px}
.note.warn{color:var(--warn);background:var(--warn-soft)}
.mylist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.myitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.myitem .grow{flex:1;min-width:140px}

/* film strip */
.film{position:relative;background:#1f1f25;border-radius:12px;padding:22px 0;margin-top:14px}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,transparent 0 10px,#e9e9ee 10px 22px);opacity:.75}
.film::before{top:6px}.film::after{bottom:6px}
.film-track{display:flex;gap:10px;overflow-x:auto;scroll-behavior:auto;padding:0 12px;scrollbar-width:none}
.film-track::-webkit-scrollbar{display:none}
.frm{flex:none;width:210px;background:#fff;border-radius:6px;padding:8px}
.frm .ph{height:130px;border-radius:4px}
.frm .who{font-size:12px;font-weight:700;margin-top:6px}
.frm .txt{font-size:12px;color:var(--ink2)}
.filmctl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.gcard{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gcard .ph{height:130px;border-radius:0;border:0;border-bottom:1px dashed #c9c9d1}
.gcard .b{padding:10px}
.gcard .who{font-weight:700;font-size:13px}
.like{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px;margin-top:8px}
.like.on{background:var(--red);border-color:var(--red);color:#fff}
.like[disabled]{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
.sweet{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fffafb}
.sweet .ph{width:44px;height:44px;margin-bottom:8px}
.sweet .to{font-weight:700;font-size:13px}
.sweet .tx{font-size:13px;color:var(--ink2);margin:4px 0}
.sweet .from{font-size:12px;color:var(--muted)}

/* quiz / options */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff;text-align:left;cursor:pointer}
.opt:hover{border-color:var(--ink2)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[disabled]{cursor:default}
.expl{border-left:3px solid var(--red);background:var(--ph);border-radius:0 10px 10px 0;padding:10px 14px;margin-top:12px;font-size:14px}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.steps{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.steps span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.steps span.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.steps span.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.player{height:74px;display:flex;align-items:center;gap:12px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--ph)}
.pbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.wave{flex:1;height:30px;background:repeating-linear-gradient(90deg,#c3c3cc 0 3px,transparent 3px 6px);-webkit-mask:linear-gradient(0deg,transparent 0 0);border-radius:4px;opacity:.8}
.rec{width:74px;height:74px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer}

.chap{border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}
.chap .ph{width:64px;height:48px;flex:none}

/* table (rating) */

.candle{position:absolute;z-index:25;width:30px;height:38px;border:0;background:transparent;cursor:pointer;padding:0}
.candle svg{width:100%;height:100%}

<script>

const PROJECT = {

const BLOCKS = [

/* ---------------------------------------------------------------------
   РЕЕСТР АКТИВНОСТЕЙ
   pl  — удовольствий за одно выполнение; max — выполнений на пользователя

   --------------------------------------------------------------------- */
const ACTS = [
  // ---------- Задания-сюрпризы (шестой блок) ----------
  { id: 'reg', block: 'common', title: 'Регистрация', type: 'system', from: '2026-10-21', max: 1, pl: 1, pts: { kind: 'fixed', v: 0 }, status: 'client',

    notes: ['Заменяет серийный множитель «несколько дней подряд» из презентации: контент обновляется не каждый день, гнать людей на платформу ежедневно незачем.'] },

  // ---------- Работа и обучение («Начинка») ----------
  { id: 'recipe', block: 'work', title: 'Секретный рецепт', sub: 'Кадр в истории', type: 'ugc_photo', from: '2026-10-21', max: 2, pl: 1, pts: { kind: 'fixed', v: 30 }, status: 'ok',

  { id: 'quiz1', block: 'work', title: 'Дегустация фактов. Выпуск 1', sub: 'Квиз с эксплейнерами', type: 'quiz', from: '2026-10-28', max: 1, pl: 3, pts: { kind: 'score', v: 20 }, status: 'draft',

/* ---------- логика доступности и начислений (описана в ТЗ, раздел «Доступность и начисления») ---------- */
const ended = () => S.date > PROJECT.end;
const cnt = a => S.done[a.id] || 0;
const isComplete = a => cnt(a) >= (a.max || 1);
const hasPending = a => (S.sub[a.id] || []).some(x => x.st === 'pending');
function actState(a) {
  if (isComplete(a)) return 'done';
  if (ended()) return 'ended';
  if (S.date < a.from) return 'soon';
  if (a.to && S.date > a.to) return 'closed';
  if (a.dep && !isComplete(A[a.dep])) return 'locked';
  if (hasPending(a) && cnt(a) === 0) return 'pending';
  if (cnt(a) > 0) return 'partial';
  return 'open';
}
const canDo = a => ['open', 'partial', 'pending'].includes(actState(a));
const plMax = a => (a.pl || 0) * (a.max || 1);
const plGot = a => (a.pl || 0) * Math.min(cnt(a), a.max || 1);
const PL_MAX = ACTS.reduce((s, a) => s + plMax(a), 0);
const totalPl = () => ACTS.reduce((s, a) => s + plGot(a), 0);
const totalPts = () => Object.values(S.apts).reduce((s, v) => s + v, 0);
function blockStats(bid) { let got = 0, max = 0; ACTS.filter(a => a.block === bid).forEach(a => { got += plGot(a); max += plMax(a); }); return { got, max }; }
const listable = a => !a.hidden && !['system', 'visit'].includes(a.type) && a.block !== 'stream';
const myPlace = () => Math.max(11, 3140 - totalPts() * 7);

function activeBooster() {
  if (!S.hh || !S.auth) return null;
  let b = BOOSTERS.find(x => canDo(A[x.act]));
  if (!b) { const a = ACTS.find(x => listable(x) && canDo(x) && x.pts.v > 0); if (a) b = { act: a.id, mult: 2, demo: true }; }
  return b || null;
}
function award(id, pts, opt = {}) {
  const a = A[id]; const bo = activeBooster();
  const mult = bo && bo.act === id && pts > 0 ? bo.mult : 1;
  const p = pts * mult;
  const before = totalPl();
  if (!opt.pointsOnly) S.done[id] = cnt(a) + 1;
  S.apts[id] = (S.apts[id] || 0) + p;
  const pl = opt.pointsOnly ? 0 : (a.pl || 0);
  const parts = [];
  if (pl) parts.push(`+${pl} ${wPl(pl)}`);
  if (p) parts.push(`+${p} ${wPts(p)}`);
  if (mult > 1) parts.push('×2 счастливый час');
  if (parts.length) toast(`<b>${parts.join(' · ')}</b> — ${esc(a.title)}`);
  if (before < PL_MAX && totalPl() === PL_MAX) setTimeout(() => modal(`<div class="ph round" style="width:70px;height:70px;margin:0 auto">торт</div><h3>Все ${PL_MAX} удовольствия собраны!</h3><p>Ты участвуешь в розыгрыше среди собравших весь торт.</p><button class="btn red" data-act="closeModal">Ура!</button>`), 500);
}
function checkVisit() {
  if (!S.auth || ended() || S.date < PROJECT.start) return;
  const w = Math.floor(dayDiff(PROJECT.start, S.date) / 7);
  if (S.visitWeeks.has(w) || isComplete(A.visit)) return;

}

/* ---------- торт ---------- */
function pol(cx, cy, r, deg) { const t = deg * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; }
function arcPath(cx, cy, r0, r1, a0, a1) {
  const [x0, y0] = pol(cx, cy, r1, a0), [x1, y1] = pol(cx, cy, r1, a1), [x2, y2] = pol(cx, cy, r0, a1), [x3, y3] = pol(cx, cy, r0, a0);
  const f = n => n.toFixed(1);
  return `M${f(x0)} ${f(y0)} A${r1} ${r1} 0 0 1 ${f(x1)} ${f(y1)} L${f(x2)} ${f(y2)} A${r0} ${r0} 0 0 0 ${f(x3)} ${f(y3)}Z`;
}
function cakeSVG(withProgress) {
  const bl = BLOCKS.filter(b => b.cake); const n = bl.length; const cx = 200, cy = 200;
  const ph = ended() ? 'eat' : phaseOf(S.date).id;
  let s = `<svg class="cake ${ph}" viewBox="0 0 400 400" role="img" aria-label="Торт из ${n} частей">`;
  bl.forEach((b, i) => {
    const a0 = -90 + i * 360 / n + 1.2, a1 = -90 + (i + 1) * 360 / n - 1.2;
    const st = blockStats(b.id); const got = withProgress ? st.got : 0;
    const [tx, ty] = pol(0, 0, ph === 'eat' && i === 0 ? 12 : 0, (a0 + a1) / 2);
    s += `<g class="seg" transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)})" data-go="${S.auth ? 'block/' + b.id : 'register'}"><path d="${arcPath(cx, cy, 48, 192, a0, a1)}"/>`;
    let placed = 0, k = 0;
    for (const rad of [70, 94, 118, 142]) {
      if (placed >= st.max) break;
      const cap = Math.max(1, Math.floor(((a1 - a0 - 10) * Math.PI / 180 * rad) / 21)); const c = Math.min(cap, st.max - placed);
      for (let j = 0; j < c; j++) {
        const ang = a0 + 5 + (j + .5) / c * (a1 - a0 - 10); const [x, y] = pol(cx, cy, rad, ang);
        s += `<circle class="dot ${k < got ? 'on' : ''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"/>`; k++;
      }
      placed += c;
    }
    const mid = (a0 + a1) / 2; const [lx, ly] = pol(cx, cy, 166, mid);
    b.lines.forEach((ln, li) => { s += `<text class="segl" x="${lx.toFixed(1)}" y="${(ly - 8 + li * 14 - (b.lines.length - 1) * 7).toFixed(1)}" text-anchor="middle">${esc(ln)}</text>`; });
    s += `<text class="segn" x="${lx.toFixed(1)}" y="${(ly + 10 + (b.lines.length - 1) * 7).toFixed(1)}" text-anchor="middle">${withProgress ? got + ' из ' : ''}${st.max}</text></g>`;
  });
  s += `<circle class="core" cx="${cx}" cy="${cy}" r="42"/><text class="core33" x="${cx}" y="${cy + 15}" text-anchor="middle">33</text>`;
  if (ph !== 'prep') [188, 200, 212].forEach(x => { s += `<rect class="ckc" x="${x - 2.5}" y="${cy - 26}" width="5" height="16" rx="1.5"/>`; if (ph === 'blow') s += `<ellipse class="ckf" cx="${x}" cy="${cy - 31}" rx="3" ry="4.5"/>`; });
  return s + '</svg>';
}

/* ---------- этапы, блоки, рейтинг ---------- */
const phaseOf = d => PHASES.find(p => d >= p.from && d <= p.to) || (d < PHASES[0].from ? PHASES[0] : PHASES[PHASES.length - 1]);
const actPhase = a => a.from < PROJECT.stream ? PHASES[0] : PHASES[2];

  return `<div class="phases">${PHASES.map((p, i) => `<div class="phase ${!off && i === ci ? 'on' : ''} ${off || i < ci ? 'past' : ''}"><div class="pn">${off || i < ci ? '✓' : i + 1}</div><div><div class="pt">${esc(p.title)}</div><div class="pd">${p.from === p.to ? dm(p.from) : dm(p.from) + '–' + dm(p.to)}</div><div class="px">${esc(p.desc)}</div></div></div>`).join('')}</div>`;
}
function cakeCaption() {
  const t = { prep: 'Готовим торт: собирай удовольствия — торт допекается', blow: 'Сегодня на эфире задуваем свечу', eat: 'Едим торт! Свеча задута — основные задания открыты' }[phaseOf(S.date).id];
  return `<div class="small muted" style="text-align:center">${t}. Нажми на часть торта, чтобы открыть задания</div>`;
}
function blockTiles() {

    return `<div class="btile ${b.cake ? '' : 'extra'}" data-go="block/${b.id}"><div class="t">${esc(b.name)}</div><div class="s">${b.section ? '«' + esc(b.section) + '»' : 'Вне торта'}</div><div class="bar"><i style="width:${st.max ? Math.round(st.got / st.max * 100) : 0}%"></i></div><div class="s">${st.got} из ${st.max}</div></div>`; }).join('')}</div>`;
}
const ratingTop = n => PEOPLE.slice(0, n).map((p, i) => ({ p, pts: 640 - i * 23, pl: Math.max(18, 33 - i) }));
function ratingTable(n) {
  return `<table class="rtable"><thead><tr><th>#</th><th>Участник</th><th class="hm">Удовольствия</th><th>Баллы</th></tr></thead><tbody>
    ${ratingTop(n).map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.p)}</td><td class="hm">${r.pl} / ${PL_MAX}</td><td>${r.pts}</td></tr>`).join('')}
    <tr><td colspan="4" class="muted" style="text-align:center">…</td></tr>
    <tr class="me"><td>${totalPts() ? myPlace() : '—'}</td><td>Ты</td><td class="hm">${totalPl()} / ${PL_MAX}</td><td>${totalPts()}</td></tr></tbody></table>`;
}
function miniRating() {

}
function pointsTable() {
  const rows = BLOCKS.flatMap(b => { const acts = ACTS.filter(a => a.block === b.id && (a.pts.v || a.pts.live)); if (!acts.length) return [];
    return [`<tr class="grp"><td colspan="3">${esc(b.name)}</td></tr>`, ...acts.map(a => { const secret = a.hidden && !isComplete(a);
      return `<tr><td>${secret ? '??? Секретное задание' : `<span class="link" data-go="${a.block === 'stream' ? 'stream' : 'act/' + a.id}">${esc(a.title)}</span>`}</td><td>${secret ? '?' : esc(ptsLabel(a))}</td><td class="hm">${a.max > 1 ? 'до ' + a.max + ' раз' : '1 раз'}</td></tr>`; })]; });

    <table class="rtable"><thead><tr><th>Активность</th><th>Баллы</th><th class="hm">Сколько раз</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;

  </div></section>

  </div></section></div>`;

function vHome() {
  if (ended()) return vFinal();

function vFinal() {

      <div class="small muted">Баллы: <b style="color:var(--ink)">${totalPts()}</b> · итоговое место: <b style="color:var(--ink)">${totalPts() ? myPlace() : '—'}</b></div></div>
    <div class="ctas" style="margin-top:14px"><button class="btn red" data-go="prizes">Итоги розыгрышей</button><button class="btn" data-go="stream">Запись эфира</button><button class="btn ghost" data-go="progress">Мой прогресс</button></div>

/* ---------- активность: каркас ---------- */
function vAct(id) {
  const a = A[id]; if (!a) return v404();
  const b = B[a.block]; const st = actState(a);
  const head = `<div class="pg-h"><div class="crumbs"><a data-go="home">Главная</a> / ${a.block === 'stream' ? '<a data-go="stream">Эфир</a>' : `<a data-go="block/${b.id}">${esc(b.name)}</a>`}</div>
    <h1>${esc(a.title)}</h1><div class="muted">${a.sub ? esc(a.sub) + ' · ' : ''}${esc(b.name)} ${sBadge(a)}</div>
    <div class="chips">${plChip(a)}<span class="chip">${esc(ptsLabel(a))}</span><span class="chip">${dateLabel(a)}</span>${a.block === 'stream' ? '' : `<span class="chip">${esc(actPhase(a).title)}</span>`}${stateChip(a)}</div></div>`;
  let body;
  if (a.hidden && st !== 'done' && a.type !== 'find') body = `<div class="panel center"><h3>??? Секретное задание</h3><p class="muted">Механика в работе. Задание появится неожиданно.</p></div>`;
  else if (st === 'soon') body = `<div class="panel center"><h3>Откроется ${dm(a.from)}</h3><p class="muted">${esc(a.desc)}</p>${demoBtn('setDate', 'перейти на ' + dm(a.from), `data-v="${a.from}"`)}</div>`;

  else body = (BODY[a.type] || bodyStub)(a, st);

}
const ro = st => ['ended', 'closed', 'done'].includes(st);
const bodyStub = a => `<div class="panel center"><h3>${esc(a.title)}</h3><p class="muted">${esc(a.desc)}</p></div>`;

/* ---------- тела активностей по типам механик ---------- */
const BODY = {
  system: a => `<div class="panel center"><h3>${isComplete(a) ? 'Готово ✓' : 'Начисляется автоматически'}</h3><p class="muted">${esc(a.desc)}</p></div>`,
  visit: a => `<div class="panel center"><h3>Бонус недели</h3><p class="muted">${esc(a.desc)} Получено: ${cnt(a)} из ${a.max}.</p></div>`,
  tbd: bodyStub,
  find: a => `<div class="panel center"><h3>${isComplete(a) ? 'Свечка найдена ✓' : 'Свечка где-то прячется'}</h3><p class="muted">Задание нигде не анонсируется: иконка появляется в случайном месте интерфейса. В демо-панели нажми «Спрятать свечку».</p></div>`,

  ugc_photo(a, st) {
    const tab = S.ui['tab_' + a.id] || 'feed'; const mine = S.sub[a.id] || [];

  },

  ugc_video(a, st) {
    const tab = S.ui['tab_' + a.id] || 'gallery'; const mine = S.sub[a.id] || [];
    const tabs = `<div class="tabs2"><button class="${tab === 'gallery' ? 'on' : ''}" data-act="tab" data-id="${a.id}" data-v="gallery">Галерея</button><button class="${tab === 'my' ? 'on' : ''}" data-act="tab" data-id="${a.id}" data-v="my">Мой номер · ${mine.length} из ${a.max}</button></div>`;

      <label class="check"><input type="checkbox"> Готов выступить вживую <span class="sbadge client">уточнить: офлайна нет</span></label>`;
    return tabs + ugcForm(a, st, { file: 'Видео или фото', text: 'Расскажи о своём хобби или таланте', noun: 'номер', extra });

  like(a) { return `<p class="muted" style="margin-top:14px">Поддержи номера коллег в галерее талант-шоу. Удовольствие — за первую поддержку.</p>` + gallery(); },

  quiz(a, st) {

    }
    if (ro(st)) return bodyStub(a);
    if (q.phase === 'intro') return `<div class="panel"><h3>${qs.length} вопроса · до ${a.pts.v} баллов · ${a.pl} ${wPl(a.pl)}</h3><p class="muted">После каждого ответа — короткое объяснение или факт из истории компании. Удовольствия начисляются за прохождение, баллы — за верные ответы.</p><button class="btn red" data-act="quizStart" data-id="${a.id}">Начать</button></div>`;
    const cur = qs[q.i]; const my = q.ans[q.i]; const answered = my != null;
    return `<div class="panel"><div class="qhead"><span class="muted small">Вопрос ${q.i + 1} из ${qs.length}</span><span class="chip">верных: ${q.ans.filter((x, i) => x === qs[i].right).length}</span></div>
      <h3 style="margin-top:8px">${esc(cur.q)}</h3>
      <div class="opts">${cur.opts.map((o, i) => `<button class="opt ${answered ? (i === cur.right ? 'right' : (i === my ? 'wrong' : '')) : ''}" ${answered ? 'disabled' : ''} data-act="quizAns" data-id="${a.id}" data-v="${i}">${esc(o)}</button>`).join('')}</div>
      ${answered ? `<div class="expl"><b>${my === cur.right ? 'Верно!' : 'Не совсем.'}</b> Эксплейнер: короткое объяснение или факт из истории компании (контент — от клиента).</div><div style="margin-top:12px"><button class="btn red" data-act="quizNext" data-id="${a.id}">${q.i + 1 < qs.length ? 'Дальше' : 'Завершить'}</button></div>` : ''}
    </div>`;
  },

  audio(a, st) {
    const s = S.audio[a.id] || { step: 0 };
    if (a.mode === 'sing') {

function routeView() {

  switch (base) {
    case 'landing': return vLanding();
    case 'register': return vRegister();
    case 'login': return vLogin();
    case 'recover': return vRecover();
    case 'home': return vHome();
    case 'block': return vBlock(param);
    case 'act': return vAct(param);
    case 'progress': return vProgress();
    case 'rating': return vRating();
    case 'prizes': return vPrizes();
    case 'stream': return vStream();
    case 'rules': return vRules();
    case 'faq': return vFaq();
    case 'profile': return vProfile();
    default: return v404();
  }
}
function render() {
  clearTimers();
  const view = routeView();
  const site = document.getElementById('site');
  site.innerHTML = header() + `<main class="main">${view}</main>` + footer();
  document.getElementById('url').textContent = 'https://[домен согласуется]/' + (S.route === 'landing' ? '' : S.route);
  const fr = document.getElementById('frame'); fr.classList.toggle('mobile', S.view === 'mobile'); fr.classList.toggle('desktop', S.view !== 'mobile');
  afterRender(site);

}
function afterRender(site) {
  // лента-киноплёнка
  const tr = document.getElementById('filmTrack');
  if (tr) {
    let hover = false;
    tr.addEventListener('mouseenter', () => hover = true); tr.addEventListener('mouseleave', () => hover = false);
    tr.addEventListener('touchstart', () => hover = true, { passive: true }); tr.addEventListener('touchend', () => later(() => hover = false, 1500));
    every(() => { if (S.ui.filmPaused || hover) return; tr.scrollLeft += 1; if (tr.scrollLeft + tr.clientWidth >= tr.scrollWidth - 1) tr.scrollLeft = 0; }, 30);
  }
  // таймеры видео
  Object.entries(S.vid).forEach(([id, v]) => {
    if (!v.started || v.ready || !document.getElementById('vt')) return;
    every(() => { v.left--; const el = document.getElementById('vt'); if (el) el.textContent = v.left; if (v.left <= 0) { v.ready = true; render(); } }, 1000);
  });
  // запись АПОЖ
  const rec = document.getElementById('rect');
  if (rec) { let t = 3; every(() => { t--; rec.textContent = '0:0' + t; if (t <= 0) { const s = S.audio.apozh1; s.rec = false; s.step = 2; render(); } }, 1000); }
  // игра
  Object.entries(S.game).forEach(([id, g]) => {
    if (g.phase !== 'play' || !document.querySelector('.runner')) return;
    later(() => { const r = 1 + Math.floor(Math.random() * 4); const a = A[id]; const first = !isComplete(a); const gain = Math.max(0, r - (g.best || 0)) * a.pts.v;
      g.last = r; g.phase = 'result'; if (r > (g.best || 0)) g.best = r;
      if (first) award(id, gain); else if (gain) award(id, gain, { pointsOnly: true }); else toast('Рекорд не побит — в рейтинге остаётся лучший результат');
      render(); }, 2200);
  });
  // обратный отсчёт счастливого часа
  const cd = document.getElementById('hhcd');
  if (cd) { let sec = 42 * 60 + 15; every(() => { sec--; const el = document.getElementById('hhcd'); if (el) el.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }, 1000); }
  // свечка
  if (S.candle && S.auth && !S.candleFound) {
    if (!S.candlePos) S.candlePos = { top: 150 + Math.random() * 650, left: 6 + Math.random() * 84 };
    site.insertAdjacentHTML('beforeend', `<button class="candle" data-act="candle" style="top:${S.candlePos.top}px;left:${S.candlePos.left}%" title="?"><svg viewBox="0 0 30 38"><path d="M15 2c3 5 5 7 5 10a5 5 0 0 1-10 0c0-3 2-5 5-10z" fill="#ffb020"/><rect x="10" y="16" width="10" height="20" rx="2" fill="#ff0032"/><rect x="10" y="21" width="10" height="3" fill="#fff"/><rect x="10" y="28" width="10" height="3" fill="#fff"/></svg></button>`);
  }
  // счётчики символов
  site.querySelectorAll('[data-counter]').forEach(t => t.addEventListener('input', () => { const c = document.getElementById(t.dataset.counter); if (c) c.textContent = t.value.length; }));
}

  quizNext(el) {

  audioRec(el) { const s = S.audio[el.dataset.id]; if (s.rec) { s.rec = false; s.step = 2; } else s.rec = true; render(); },
  audioGuess(el) { const id = el.dataset.id; const s = S.audio[id] = S.audio[id] || {}; s.ok = +el.dataset.v === (id === 'apozh1' ? 2 : 1); award(id, A[id].pts.v); render(); },
  audioShare(el) { award(el.dataset.id, A[el.dataset.id].pts.v); render(); },
  vidPlay(el) { const id = el.dataset.id; const v = S.vid[id] = S.vid[id] || {}; if (!v.started && !isComplete(A[id]) && !ended()) { v.started = true; v.left = 5; render(); } else toast('Воспроизведение'); },
  vidDone(el) { award(el.dataset.id, A[el.dataset.id].pts.v); render(); },

/* ---------- демо: заполнить прогресс ---------- */
function demoFill() {
  if (!S.auth) { S.auth = true; award('reg', 0); }
  ACTS.forEach(a => {
    if (a.hidden || a.block === 'stream' || a.type === 'visit' || !canDo(a) || Math.random() < .35) return;
    const n = a.max > 1 ? 1 + Math.floor(Math.random() * a.max) : 1; S.done[a.id] = n;
    const p = a.pts; S.apts[a.id] = p.kind === 'fixed' ? p.v * n : p.kind === 'score' ? Math.round(p.v * .75) : p.kind === 'result' ? p.v * 2 : 0;
    if (['ugc_photo', 'ugc_video', 'thanks'].includes(a.type)) S.sub[a.id] = Array.from({ length: n }, (_, i) => ({ st: 'ok', text: 'Демо', nom: NOMS[i], to: PEOPLE[i] }));
    if (a.type === 'quiz') S.quiz[a.id] = { phase: 'result', ans: [1, 0, 0, 1], i: 3 };
    if (a.type === 'game') S.game[a.id] = { phase: 'start', best: 2 };
    if (a.type === 'audio') S.audio[a.id] = { step: 3, ok: true };
    if (a.id === 'vol1') S.vol = 'p1';
    if (a.type === 'story' && a.mode === 'vote') S.votes[a.id] = 0;
    if (a.id === 'aiguess') S.guess = 1;
    if (a.id === 'talent_like') S.likes.add('t1');
  });
  checkVisit(); toast('Демо-прогресс заполнен'); go('home');
}

function ptsText(a) {

  if (p.kind === 'score') return `до ${p.v} за выпуск, пропорционально верным ответам`;

  return '—';
}
const availText = a => a.to ? (a.to === a.from ? `только ${dm(a.from)}` : `${dm(a.from)} – ${dm(a.to)}`) : `с ${dm(a.from)} до конца кампании`;
const blockName = id => B[id].section ? `${B[id].name} («${B[id].section}»)` : B[id].name;

/* ---------- генерируемые куски ---------- */
function gantt() {
  const days = dayDiff(PROJECT.start, PROJECT.end) + 1;
  const pos = iso => Math.max(0, Math.min(100, dayDiff(PROJECT.start, iso) / days * 100));
  const ticks = [];
  for (let i = 0; i < days; i += 3) { const d = new Date(PROJECT.start + 'T12:00:00'); d.setDate(d.getDate() + i); const iso = d.toISOString().slice(0, 10); ticks.push(`<span class="tick" style="left:${(i + .5) / days * 100}%">${dm(iso)}</span>`); }
  const eth = `<i class="eth" style="left:${(dayDiff(PROJECT.start, PROJECT.stream) + .5) / days * 100}%"></i>`;
  let rows = `<div class="gr gh"><div class="gl">Активность</div><div class="gt">${ticks.join('')}${eth}</div></div>`;
  BLOCKS.forEach(b => {
    const acts = ACTS.filter(a => a.block === b.id); if (!acts.length) return;
    rows += `<div class="gr gblk"><div class="gl">${esc(b.name)}</div><div class="gt">${eth}</div></div>`;
    acts.forEach(a => {
      const to = a.to || PROJECT.end; const l = pos(a.from); const w = Math.max(100 / days, (dayDiff(a.from, to) + 1) / days * 100);
      rows += `<div class="gr"><div class="gl" data-tz="act-${a.id}" title="${esc(a.title)}">${esc(shortT(a))}</div><div class="gt"><i class="gb ${a.status}" style="left:${l}%;width:${w}%"></i>${eth}</div></div>`;
    });
  });
  return `<div class="gantt">${rows}</div><p class="small muted">Красная линия — эфир ${dm(PROJECT.stream)}. Цвет полосы — статус проработки активности.</p>`;
}
function ptsShort(a) {
  const p = a.pts;
  if (p.kind === 'fixed') return p.v ? String(p.v) : '—';
  if (p.kind === 'score') return `до ${p.v}`;
  if (p.kind === 'result') return `${p.v} / рубеж`;
  if (p.kind === 'bonus') return `бонус ${p.v}`;
  if (p.kind === 'code') return `${p.live} / ${p.rec}`;
  return '—';
}
function registry() {
  let rows = ''; let tot = 0;
  BLOCKS.forEach(b => {
    const acts = ACTS.filter(a => a.block === b.id); if (!acts.length) return; const st = blockStats(b.id); tot += st.max;
    rows += `<tr class="blk"><td colspan="7">${esc(blockName(b.id))}</td><td class="num">${st.max}</td></tr>`;
    acts.forEach(a => {
      const dates = a.to ? (a.to === a.from ? dm(a.from) : `${dm(a.from)}–${dm(a.to)}`) : `с ${dm(a.from)}`;
      rows += `<tr><td>${tzA(a.id)}${a.hidden ? ' <span class="muted">(скрытая)</span>' : ''}</td><td><a data-tz="mech-${a.type}">${esc(MECH[a.type].short)}</a></td><td style="white-space:nowrap">${dates}</td><td>${a.dep ? `<a data-tz="act-${a.dep}">${esc(shortT(A[a.dep]))}</a>` : '—'}</td><td class="num">${a.pl || 0} × ${a.max || 1}</td><td class="num">${esc(ptsShort(a))}</td><td>${sb(a.status)}</td><td class="num"><b>${plMax(a)}</b></td></tr>`;
    });
  });
  const ok = tot === PROJECT.pleasuresTotal;
  rows += `<tr class="tot"><td colspan="7">Итого удовольствий в реестре${ok ? '' : ' — не сходится с ' + PROJECT.pleasuresTotal + '!'}</td><td class="num">${tot} / ${PROJECT.pleasuresTotal}</td></tr>`;
  return `<div class="tblwrap"><table class="tbl"><thead><tr><th>Активность</th><th>Механика</th><th>Даты</th><th>Зависит от</th><th class="num">Уд. × раз</th><th class="num">Баллы</th><th>Статус</th><th class="num">Всего уд.</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="small muted">«Уд. × раз» — удовольствий за одно выполнение × лимит выполнений. Баллы: число — за выполнение; «до N» — пропорционально верным ответам; «N / рубеж» — за рубеж в игре, в рейтинг идёт лучший результат; «10 / 2» — в прямом эфире / в записи. Даты «с …» — до конца кампании.</p>`;
}

/* ---------- рендер ТЗ ---------- */
function renderTZ() {
  const doc = document.getElementById('tzdoc');
  doc.innerHTML = `<div class="tzin"><h1>ТЗ: ${esc(PROJECT.doc)}</h1>${TZ.map((s, i) => `<section id="${s.id}"><h2><span class="n">${i + 1}</span>${esc(s.title)}</h2>${s.html()}</section>`).join('')}</div>`;
  const nav = document.getElementById('tznav');
  nav.innerHTML = `<input class="search" id="tzsearch" placeholder="Поиск по разделам">` + TZ.map((s, i) => {
    const link = `<a data-tz="${s.id}" data-sec="${s.id}"><span class="n">${i + 1}</span>${esc(s.title)}</a>`;
    if (!s.kids) return link;
    return `<details data-det="${s.id}"><summary>${link}</summary><div class="kids">${s.kids().map(k => `<a data-tz="${k.id}" data-sec="${k.id}">${esc(k.t)}</a>`).join('')}</div></details>`;
  }).join('');
  document.getElementById('tzsearch').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    nav.querySelectorAll('a[data-tz]').forEach(a => { a.style.display = !q || a.textContent.toLowerCase().includes(q) ? '' : 'none'; });
    nav.querySelectorAll('details').forEach(d => { d.open = !!q; });
  });
}
function tzGo(id) {
  const el = document.getElementById(id); if (!el) return;
  const det = document.querySelector(`#tznav details[data-det="${id.split('-')[0] === 'act' ? 'acts' : id.startsWith('mech-') ? 'mech' : id.startsWith('scr-') ? 'screens' : ''}"]`);
  if (det) det.open = true;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  setHash('tz/' + id);
}
function tzSpy() {
  const doc = document.getElementById('tzdoc'); const top = doc.getBoundingClientRect().top + 90;
  let cur = null;
  document.querySelectorAll('#tzdoc section, #tzdoc .tzcard').forEach(el => { if (el.getBoundingClientRect().top <= top) cur = el.id; });
  document.querySelectorAll('#tznav a').forEach(a => a.classList.toggle('on', a.dataset.sec === cur));
}

function setHash(h) { try { history.replaceState(null, '', '#' + h); } catch (e) { } }
function showTab(t) {
  document.getElementById('tab-proto').hidden = t !== 'proto';
  document.getElementById('tab-tz').hidden = t !== 'tz';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'tz') { setHash('tz'); tzSpy(); } else setHash('proto/' + S.route);
}
function tzAnchor() {
  const [b, p] = S.route.split('/');
  if (b === 'act') return 'act-' + p;
  if (b === 'block') return 'scr-block';
  if (b === 'home' && ended() && S.auth) return 'scr-final';
  if (!S.auth && !PUBLIC.includes(b)) return 'scr-login';
  return document.getElementById('scr-' + b) ? 'scr-' + b : 'screens';
}
function openInProto(route) {
  if (route === 'final') { S.date = '2026-11-12'; S.auth = true; route = 'home'; }
  const [b, p] = route.split('/');
  if (['landing', 'register', 'login', 'recover'].includes(b)) S.auth = false;
  else if (!PUBLIC.includes(b) && !S.auth) { S.auth = true; if (!isComplete(A.reg)) S.done.reg = 1; }
  if (b === 'act' && A[p]) {
    const a = A[p];
    const fits = d => d >= a.from && (!a.to || d <= a.to) && d <= PROJECT.end;
    if (!fits(S.date)) S.date = (DEMO_DATES.find(d => fits(d.v)) || { v: a.from }).v;
  }
  if (b === 'stream' && S.date < PROJECT.stream && route === 'stream') { /* показываем как есть: отсчёт до эфира */ }
  showTab('proto'); go(route);
}
function syncDemo() {
  const sel = document.getElementById('d_date');
  const opts = DEMO_DATES.map(d => `<option value="${d.v}">${d.l}</option>`);
  if (!DEMO_DATES.some(d => d.v === S.date)) opts.push(`<option value="${S.date}">${dm(S.date)} — из ТЗ</option>`);
  sel.innerHTML = opts.join(''); sel.value = S.date;
  document.querySelectorAll('#d_auth button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === S.auth));
  document.querySelectorAll('#d_view button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  document.getElementById('d_hh').classList.toggle('on', S.hh);
  document.getElementById('d_candle').classList.toggle('on', S.candle && !S.candleFound);
}
function buildScreenSelect() {
  const base = [['landing', 'Лендинг (гость)'], ['register', 'Регистрация'], ['login', 'Вход'], ['recover', 'Восстановление пароля'], ['home', 'Главная'], ['progress', 'Мой прогресс'], ['rating', 'Рейтинг'], ['prizes', 'Призы'], ['stream', 'Эфир'], ['rules', 'Правила'], ['faq', 'FAQ'], ['profile', 'Профиль'], ['final', 'Финальное состояние']];
  let h = `<option value="">— перейти к экрану —</option><optgroup label="Экраны">${base.map(([r, t]) => `<option value="${r}">${t}</option>`).join('')}</optgroup>`;
  BLOCKS.forEach(b => {
    const acts = ACTS.filter(a => a.block === b.id && !['system', 'visit'].includes(a.type)); if (!acts.length) return;
    h += `<optgroup label="${esc(b.name)}"><option value="block/${b.id}">Страница блока</option>${acts.map(a => `<option value="act/${a.id}">${esc(shortT(a))}</option>`).join('')}</optgroup>`;
  });
  document.getElementById('d_screen').innerHTML = h;
}

document.addEventListener('DOMContentLoaded', () => {
  buildScreenSelect(); renderTZ();
  // вкладки
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  // демо-панель
  document.getElementById('d_date').addEventListener('change', e => setDate(e.target.value));
  document.getElementById('d_auth').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v === '1') { if (!S.auth) { S.auth = true; if (!isComplete(A.reg)) award('reg', 0); checkVisit(); go('home'); } }
    else { S.auth = false; go('landing'); }
  });
  document.getElementById('d_view').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.view = b.dataset.v; render(); });
  document.getElementById('d_hh').addEventListener('click', () => {
    if (!S.auth) { toast('Счастливый час виден участникам — переключись на «Участник»'); return; }
    S.hh = !S.hh; render(); if (S.hh && !activeBooster()) toast('Сейчас нет доступной активности для бустера — смени дату');
  });
  document.getElementById('d_candle').addEventListener('click', () => {
    if (S.candleFound) { toast('Свечка уже найдена. «Сбросить» — чтобы спрятать снова'); return; }
    if (!S.auth) { S.auth = true; if (!isComplete(A.reg)) S.done.reg = 1; S.route = 'home'; }
    S.candle = !S.candle; S.candlePos = null; render(); if (S.candle) toast('Свечка спрятана где-то на странице');
  });
  document.getElementById('d_fill').addEventListener('click', demoFill);
  document.getElementById('d_reset').addEventListener('click', () => { resetProgress(); S.hh = false; S.candle = false; if (S.auth) S.done.reg = 1; toast('Прогресс сброшен'); render(); });
  document.getElementById('d_screen').addEventListener('change', e => { if (e.target.value) openInProto(e.target.value); e.target.value = ''; });
  // клики внутри прототипа
  const handler = e => {
    const act = e.target.closest('[data-act]');
    if (act && ACTIONS[act.dataset.act]) { if (act.disabled) return; e.preventDefault(); ACTIONS[act.dataset.act](act); return; }
    const g = e.target.closest('[data-go]');
    if (g) { if (g.disabled) return; e.preventDefault(); go(g.dataset.go); }
  };
  document.getElementById('frame').addEventListener('click', handler);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
  document.getElementById('tzbtn').addEventListener('click', () => { showTab('tz'); setTimeout(() => tzGo(tzAnchor()), 30); });
  // ТЗ: ссылки
  document.getElementById('tab-tz').addEventListener('click', e => {
    const o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); openInProto(o.dataset.open); return; }
    const t = e.target.closest('[data-tz]'); if (t) { e.preventDefault(); tzGo(t.dataset.tz); if (window.innerWidth <= 860) document.getElementById('tznav').classList.remove('on'); }
  });
  document.getElementById('tzdoc').addEventListener('scroll', () => { clearTimeout(window.__spy); window.__spy = setTimeout(tzSpy, 60); });
  document.getElementById('navtoggle').addEventListener('click', () => document.getElementById('tznav').classList.toggle('on'));
  // старт по адресу
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('tz')) { render(); showTab('tz'); const id = h.split('/')[1]; if (id) setTimeout(() => tzGo(id), 50); }
  else if (h.startsWith('proto/')) { openInProto(h.slice(6)); }
  else { render(); showTab('proto'); }
});

document.querySelector('.chrome .ver').textContent = `Прототип и ТЗ · v${PROJECT.version} · ${PROJECT.updated}`;
</script>
</body>
</html>
